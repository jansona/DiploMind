<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>DiploMind</title>
<style>
:root{--bg:#f4f2ec;--pnl:#fff;--bd:#d8d2c4;--ink:#2b2620;--accent:#b5651d}
body{font:13px/1.5 system-ui,monospace;margin:0;background:var(--bg);color:var(--ink)}
#menu,#setup{max-width:760px;margin:1.5em auto;padding:1em}
h1,h2,h3{font-weight:600;margin:.4em 0}.v{display:none}.p{color:var(--accent)}.r{color:#c00}
button{font:13px system-ui;background:var(--accent);color:#fff;border:0;border-radius:5px;padding:5px 10px;cursor:pointer;margin:1px}
button:hover{filter:brightness(1.1)}select,input{font:13px system-ui;border:1px solid var(--bd);border-radius:5px;padding:4px}
#rooms button,#saves button{background:var(--pnl);color:var(--ink);border:1px solid var(--bd);display:block;width:100%;text-align:left;margin:3px 0}
#bar{background:var(--ink);color:#fff;padding:6px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}#bar button{background:#5a5249}
#grid{display:grid;grid-template-columns:1fr 320px;gap:10px;padding:10px;max-width:1100px;margin:auto}
.card{background:var(--pnl);border:1px solid var(--bd);border-radius:8px;padding:8px}
#map{max-height:60vh;overflow:auto}#map svg{max-width:100%;height:auto}
#log{white-space:pre-wrap;height:32vh;overflow:auto;font:12px monospace;background:#faf8f3;border-radius:5px;padding:6px}#ch{white-space:pre-wrap;font:12px monospace}
#tabs button{font:12px;margin:1px;background:#eee;color:var(--ink)}#tabs .on{background:var(--accent);color:#fff}
#c span{display:inline-block;padding:2px 6px;margin:2px;border-radius:4px;background:#eee}#t{width:70%}
@media(max-width:700px){#grid{grid-template-columns:1fr}input,button,select{font-size:16px;min-height:36px}#t{width:80%}#map{max-height:42vh}}
</style>
<div id=menu><h1>DiploMind</h1><button onclick=toSetup()>新游戏 New Game</button> <button onclick=lobby()>刷新房间</button>
<h3>当前棋局 <span id=rcount></span></h3><div id=rooms></div><h3>继续存档</h3><div id=saves></div></div>
<div id=setup class=v><h2>新游戏</h2>房名 <input id=rn size=20 placeholder=桌名> 昵称 <input id=nm size=12 value=Host>
扮演 <select id=hsel><option>AUSTRIA<option>ENGLAND<option selected>FRANCE<option>GERMANY<option>ITALY<option>RUSSIA<option>TURKEY<option value="">观战/Spectate</select>
语言 <select id=lsel><option value=zh-Hans>简体中文<option value=en>English</select> 终局 <select id=endsel><option value=topcount>中心最多者胜<option value=draw>幸存即和</select> 口令(可空) <input id=pw size=8 placeholder=passcode>
<button onclick=create()>建房 Create</button> <button onclick=toMenu()>返回</button>
<h3>加入房间</h3>码 <input id=jc size=6> 昵称 <input id=jn size=12> 口令 <input id=jpw size=8> 国 <select id=jp><option value="">观战<option>AUSTRIA<option>ENGLAND<option>FRANCE<option>GERMANY<option>ITALY<option>RUSSIA<option>TURKEY</select><button onclick=join()>加入 Join</button></div>
<div id=game class=v>
<div id=bar>DiploMind <b id=rname></b> 房<b id=rc></b> · <b id=h></b> <b id=ph></b> <span id=md></span> 轮<span id=rd></span> <span class=r id=tm></span> <span class=r id=dc></span>
<span style=flex:1></span><span id=oc class=v><button onclick=start()>开局</button><button onclick=pause()>暂停</button>计时<select id=secsel onchange=setsecs()><option value=90>90s<option value=180 selected>180s<option value=300>300s<option value=0>不限</select>转让<select id=xfer onchange=doxfer()></select>踢<select id=kick onchange=dokick()></select><button onclick=end()>结束</button></span>
<button onclick=invite()>邀请</button><button onclick=save()>存档</button><button onclick=showres()>战报</button><button onclick=toMenu()>菜单</button><button onclick=guide()>Guide</button></div>
<div id=grid>
<div><div class=card id=map></div><div class=card>中心 <span id=c></span> · 待发<span class=p id=pd></span></div>
<div class=card id=ord style=display:none><b>下令</b> <span class=p id=ostat></span><div id=os style=max-height:200px;overflow:auto></div>已选: <span id=osel class=p></span></div>
<div class="card v" id=result><h3>最终结算</h3><div id=res></div><div id=chart></div></div></div>
<aside><div class=card><b>聊天</b><div id=tabs></div><span id=pk></span><button onclick=newp()>开私聊</button><div id=log></div>
<div id=nego><input id=t placeholder=发言><button id=bs onclick=say(0)>发送</button><button id=bk onclick=say(1)>跳过</button><div class=p id=st></div><div id=stg class=p></div></div></div>
<div class=card><b>编年史</b><div id=ch></div></div></aside></div>
<pre id=gv style=display:none;font-size:11px;max-height:160px;overflow:auto;margin:8px></pre>
<div id=inside class=v><button onclick=dbg()>看内脏</button><pre id=dbgv style=font-size:11px;max-height:160px;overflow:auto></pre></div></div>
<script>
let act='群聊',chans={},mphase='',keys='',legal='',L={},seen={},unread={},TOK='',CODE='',es=null;
function S(el,v){if(el.textContent!=v)el.textContent=v}
async function G(u,m,b){return(await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)})).json()}
function show(v){for(let x of ['menu','setup','game'])document.getElementById(x).className=x==v?'':'v'}
function save_t(d){TOK=d.token;CODE=d.code;localStorage.dm=JSON.stringify({TOK,CODE,L})}
async function toMenu(){if(es)es.close();show('menu');lobby()}
async function lobby(){let r=await G('/api/rooms');rcount.textContent='('+r.rooms.length+')';
rooms.innerHTML=r.rooms.map(x=>'<button onclick=\'jr("'+x.code+'")\'>'+(x.locked?'🔒':'')+x.name+' ['+x.code+'] '+x.status+' '+x.phase+' 人'+x.humans+'/7</button>').join('')||'(无)';
let m=await G('/api/menu');saves.innerHTML=(m.saves.length?m.saves:['(无)']).map(s=>'<button onclick=\'ld("'+s+'")\'>'+s+'</button>').join(' ')}
function toSetup(){show('setup')}
async function create(){L=await G('/api/i18n/'+lsel.value);let d=await G('/api/room/create','POST',{name:rn.value,owner_name:nm.value,power:hsel.value,lang:lsel.value,passcode:pw.value,end_rule:endsel.value});save_t(d);enter()}
async function join(){L=await G('/api/i18n/'+lsel.value);let old=(JSON.parse(localStorage.dm||'{}')).TOK;let d=await G('/api/room/join','POST',{code:jc.value.toUpperCase(),power:jp.value,name:jn.value,passcode:jpw.value,token:old});if(!d.token){alert(d.detail||'加入失败');return}save_t(d);enter()}
function jr(c){jc.value=c;toSetup()}
async function ld(n){let d=await G('/api/load?name='+n,'POST');save_t(d);L=await G('/api/i18n/zh-Hans');enter()}
async function start(){await G('/api/room/start','POST',{token:TOK})}
async function pause(){await G('/api/room/pause','POST',{token:TOK})}
async function setsecs(){await G('/api/room/secs','POST',{token:TOK,secs:+secsel.value})}
async function doxfer(){let p=xfer.value;if(p&&confirm('转让房主给 '+p+'?'))await G('/api/room/transfer','POST',{token:TOK,power:p})}
async function dokick(){let p=kick.value;if(p&&confirm('踢出 '+p+'? 该位转 AI 接管'))await G('/api/room/kick','POST',{token:TOK,power:p});kick.value=''}
async function end(){if(confirm('结束本局?')){await G('/api/room/end','POST',{token:TOK});toMenu()}}
function invite(){prompt('分享链接',location.origin+'/?join='+CODE)}
function enter(){ui();show('game');act='群聊';keys='';legal='';pk.innerHTML='';if(es)es.close();es=new EventSource('/api/stream/'+CODE+'?token='+TOK);es.onmessage=e=>R(JSON.parse(e.data))}
function pick(k){act=k;unread[k]=0;seen[k]=(chans[k]||[]).length;log.textContent=(chans[k]||[]).join('\n')||'(空)';[...tabs.children].forEach(b=>b.className=b.textContent.replace(' ✦','')==k?'on':'')}
async function newp(){let to=[...pk.querySelectorAll(':checked')].map(c=>c.value);if(!to.length)return;let ch=(await G('/api/open','POST',{token:TOK,recipient:to})).channel;pk.querySelectorAll(':checked').forEach(c=>c.checked=false);keys='';pick(ch)}
function R(s){if(s.mode=='MENU'){S(rc,CODE);oc.className='';bs.disabled=bk.disabled=t.disabled=true;S(st,'等房主开局');return}
inside.className=s.debug?'':'v';S(ph,s.phase);S(rd,s.round);S(h,s.human||'观战');S(rname,s.rname||'');S(rc,s.room||CODE);oc.className=s.owner?'':'v';
S(tm,s.secs_left!=null?'⏱'+s.secs_left+'s':(s.status=='paused'?'⏸暂停':(s.timer_on?'':'计时关')));
S(dc,((s.dropped&&s.dropped.length)?'⚠掉线:'+s.dropped.join(','):'')+((s.short&&s.short.length)?' ⏱短钟:'+s.short.join(','):''));
if(s.owner){let oth=(s.seats||[]).filter(p=>p!=s.human);let xo='<option value=>转让给…</option>'+oth.map(p=>'<option>'+p+'</option>').join('');if(xfer.innerHTML!=xo)xfer.innerHTML=xo;let ko='<option value=>踢出…</option>'+oth.map(p=>'<option>'+p+'</option>').join('');if(kick.innerHTML!=ko)kick.innerHTML=ko;secsel.value=s.timer_on?s.secs:0}
S(c,Object.entries(s.centers||{}).map(([k,v])=>k+':'+v).join(' '));S(pd,(s.pending||[]).join(',')||'—');
if(!pk.children.length)pk.innerHTML=Object.keys(s.centers||{}).filter(k=>k!=s.human).map(k=>'<label><input type=checkbox value='+k+'>'+k.slice(0,3)+'</label> ').join('');
chans=s.channels||{};if(!chans[act])act='群聊';let nk=Object.keys(chans).join(',');
for(let k in chans){let n=chans[k].length;if(k!=act&&seen[k]!=undefined&&n>seen[k])unread[k]=1;}
if(nk!=keys){keys=nk;tabs.innerHTML=Object.keys(chans).map(k=>'<button onclick=\'pick("'+k+'")\'>'+k+'</button>').join('')}
[...tabs.children].forEach(b=>{let k=b.textContent.replace(/ ✦/,'');b.textContent=k+(unread[k]?' ✦':'')});
log.textContent=(chans[act]||[]).join('\n')||'(空)';seen[act]=(chans[act]||[]).length;[...tabs.children].forEach(b=>b.className=b.textContent.replace(' ✦','')==act?'on':'');
nego.style.display=s.mode=='ORDERS'?'none':'';ord.style.display=s.mode=='ORDERS'?'':'none';
S(md,s.mode=='ORDERS'?L.ord+': '+(s.order_pending||[]).join(','):s.mode);
bs.disabled=bk.disabled=t.disabled=!s.your_turn;S(st,s.your_turn?L.sp+' ('+(s.msgs_left==undefined?3:s.msgs_left)+'条可发)':(s.staged&&s.staged!='已发0/3'?'⏳已发'+s.sent+'/3,等其他玩家':'⏳等待…'));
S(stg,(s.staged_msgs&&s.staged_msgs.length)?'📝本轮待投递('+s.staged_msgs.length+'/3,轮末统一送达): '+s.staged_msgs.join(' | '):'');
let nl=(s.legal||[]).join(',');if(nl!=legal){legal=nl;UNITS=s.units||0;os.innerHTML=(s.legal||[]).map(o=>'<label><input type=checkbox value="'+o+'" onchange=oupd()> '+o+'</label><br>').join('');osel.textContent='';S(ostat,'每单位选一条即自动结算')}
if(s.phase!=mphase){mphase=s.phase;fetch('/api/map?token='+TOK).then(r=>r.text()).then(x=>map.innerHTML=x);G('/api/chronicle?token='+TOK).then(d=>ch.textContent=d.text)}
window._last=s;if(s.end||s.status=='ended'){result.className='';drawres(s);if(s.status=='ended'&&!s.end)res.textContent='对局已被房主结束'}}
function ui(){bs.textContent=L.send||'发送';bk.textContent=L.skip||'跳过'}
async function save(){let n=prompt('存档名',new Date().toISOString().slice(0,16));if(n)await G('/api/save?name='+n+'&token='+TOK,'POST')}
async function guide(){if(gv.style.display!='none'){gv.style.display='none';return}let d=await G('/api/guide');gv.style.display='';gv.textContent='命令:\n'+Object.entries(d.cmds).map(([k,v])=>k+' = '+v).join('\n')+'\n\n地名:\n'+d.locs.join('\n')}
async function say(sk){if(t.disabled)return;if(sk&&!confirm('跳过本轮?'))return;if(!sk&&!t.value.trim()){st.textContent='⚠空';return}bs.disabled=bk.disabled=t.disabled=true;
let H=h.textContent,scope=act=='群聊'?'broadcast':'private',to=act=='群聊'?[]:act.split('·').filter(x=>x!=H);
let r=await G('/api/say','POST',{token:TOK,scope,recipient:to,content:t.value,skip:!!sk});if(r.ok)t.value='';R(r.state)}
let UNITS=0;
function unit(o){return o.split(' ')[1]}                       // orderable loc of an order string
function oupd(){let o=[...os.querySelectorAll(':checked')];osel.textContent=o.map(c=>c.value).join('; ')||'(无)';
let set=new Set(o.map(c=>unit(c.value)));if(UNITS&&set.size>=UNITS)autosub()}                     // each unit chosen -> settle
async function autosub(){let o=[...os.querySelectorAll(':checked')].map(x=>x.value);os.querySelectorAll('input').forEach(c=>c.disabled=true);S(ostat,'⏳结算中…');await G('/api/orders','POST',{token:TOK,orders:o})}
async function dbg(){if(dbgv.textContent){dbgv.textContent='';return}dbgv.textContent=JSON.stringify(await G('/api/snapshot?token='+TOK),null,1)}
let COL={AUSTRIA:'#c00',ENGLAND:'#333',FRANCE:'#06c',GERMANY:'#777',ITALY:'#0a0',RUSSIA:'#c0c',TURKEY:'#c60'};
function showres(){result.className=result.className?'':'v';if(!result.className)drawres(window._last||{})}
function drawres(s){let e=s.end;res.innerHTML=e?(e.winner?'🏆 '+e.winner+' 单独获胜('+e.centers+'中心)':e.draw?'🤝 和局, 幸存: '+(e.survivors||[]).join(', '):''):'对局进行中…';
let h=s.history||[];if(h.length<2){chart.innerHTML='';return}let P=Object.keys(COL),W=680,H=200,x=i=>30+i*(W-50)/(h.length-1),y=v=>H-20-v*(H-40)/18;
let g='<svg width=100% viewBox="0 0 '+W+' '+H+'" style="border:1px solid #ccc"><line x1=30 y1='+y(0)+' x2='+W+' y2='+y(0)+' stroke=#ccc/><text x=2 y='+y(18)+' font-size=10>18</text>';
g+=P.map(p=>'<polyline fill=none stroke="'+COL[p]+'" stroke-width=2 points="'+h.map((r,i)=>x(i)+','+y(r[p]||0)).join(' ')+'"/>'+'<text x='+(W-2)+' y='+y(h[h.length-1][p]||0)+' font-size=9 fill="'+COL[p]+'" text-anchor=end>'+p.slice(0,3)+'</text>').join('');
chart.innerHTML=g+'</svg>'}
async function resume(){try{let d=JSON.parse(localStorage.dm||'{}');if(d.TOK&&(await G('/api/state?token='+d.TOK)).mode!='MENU'){TOK=d.TOK;CODE=d.CODE;L=d.L||{};enter();return true}}catch(e){}return false}
let q=new URLSearchParams(location.search).get('join');if(q){jc.value=q;toSetup()}else resume().then(ok=>ok||toMenu())
</script>
